<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="motion.js"></script></helmet>
<svg width="{{ px }}" height="{{ px }}" viewBox="0 0 100 100" style="display:block;overflow:visible;fill:none;stroke:#2F5D4B;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round">
<ellipse cx="50" cy="91" rx="32" ry="6" style="fill:#EBD8C3;stroke:none"></ellipse>
<g display="{{ seed }}" data-anim="bob-slow">
<ellipse cx="50" cy="79" rx="15" ry="11.5" style="fill:#E6B98C;stroke:#7A5232"></ellipse>
<path d="M43 73 Q46 70.5 49 71" style="stroke:#FFF3E2;stroke-width:2"></path>
<circle cx="45" cy="79" r="1.8" style="fill:#3B2F2F;stroke:none"></circle>
<circle cx="55" cy="79" r="1.8" style="fill:#3B2F2F;stroke:none"></circle>
<path d="M47.5 82.3 Q50 84.3 52.5 82.3" style="stroke:#3B2F2F;stroke-width:1.6"></path>
<path d="M18 92 Q34 84 50 86.5 Q66 84 82 92 Z" style="fill:#D8B894;stroke:none"></path>
</g>
<g display="{{ body }}" data-anim="bob">
<path display="{{ stemS }}" d="M50 43 L50 35"></path>
<path display="{{ stemT }}" d="M50 43 L50 27"></path>
<path data-anim="sway-l" display="{{ leafA }}" d="M50 35 C43 24 32 24 28 30 C33 38 43 39 50 35 Z" fill="{{ colA }}"></path>
<path data-anim="sway-r" display="{{ leafB }}" d="M50 35 C57 24 68 24 72 30 C67 38 57 39 50 35 Z" fill="{{ colB }}"></path>
<g display="{{ bud }}" data-anim="sway-c"><path d="M50 30 C43.5 26 44 16 50 11 C56 16 56.5 26 50 30 Z" fill="#FFD66B"></path><path d="M44.5 26 Q50 31.5 55.5 26" fill="#86D9AE"></path></g>
<g display="{{ bloom }}">
<circle cx="50" cy="10.5" r="6.2" fill="#8FE3BC"></circle>
<circle cx="58.1" cy="16.4" r="6.2" fill="#8FE3BC"></circle>
<circle cx="55" cy="25.9" r="6.2" fill="#8FE3BC"></circle>
<circle cx="45" cy="25.9" r="6.2" fill="#8FE3BC"></circle>
<circle cx="41.9" cy="16.4" r="6.2" fill="#8FE3BC"></circle>
<circle cx="50" cy="19" r="5" fill="#FFD66B"></circle>
<path data-anim="twinkle" d="M16 18 Q16 25 23 25 Q16 25 16 32 Q16 25 9 25 Q16 25 16 18 Z" style="fill:#FFD66B;stroke:none"></path>
<path data-anim="twinkle" d="M84 6 Q84 12 90 12 Q84 12 84 18 Q84 12 78 12 Q84 12 84 6 Z" style="fill:#FFD66B;stroke:none"></path>
<path data-anim="twinkle" d="M89 38 Q89 42.5 93.5 42.5 Q89 42.5 89 47 Q89 42.5 84.5 42.5 Q89 42.5 89 38 Z" style="fill:#9CD2FF;stroke:none"></path>
</g>
<path display="{{ armL }}" d="M30 70 Q22 73 23 80"></path>
<path display="{{ armR }}" d="M70 70 Q78 73 77 80"></path>
<g display="{{ waveArm }}" data-anim="wave"><path d="M69 62 Q80 56 81 46"></path><circle cx="81" cy="44" r="3.6" fill="{{ bodyFill }}"></circle></g>
<g display="{{ paper }}"><path d="M31 66 Q24 64 21 61"></path><g transform="rotate(-12 13 58)"><rect x="4" y="46" width="18" height="23" rx="2.5" fill="#FFFFFF"></rect><path d="M8 52 L18 52 M8 56.5 L18 56.5 M8 61 L14 61" style="stroke:#8CC8FF;stroke-width:2"></path></g></g>
<path display="{{ glassArm }}" d="M70 70 Q75 70 76 67"></path>
<circle cx="50" cy="65" r="22" fill="{{ bodyFill }}" style="stroke-width:2.6"></circle>
<g data-anim="blink"><circle cx="43" cy="63" r="2.8" style="fill:#3B2F2F;stroke:none"></circle>
<circle cx="57" cy="63" r="2.8" style="fill:#3B2F2F;stroke:none"></circle>
<circle cx="44" cy="62" r="0.9" style="fill:#FFFFFF;stroke:none"></circle>
<circle cx="58" cy="62" r="0.9" style="fill:#FFFFFF;stroke:none"></circle></g>
<ellipse cx="37" cy="69.5" rx="4" ry="2.5" style="fill:#FFB5B5;stroke:none"></ellipse>
<ellipse cx="63" cy="69.5" rx="4" ry="2.5" style="fill:#FFB5B5;stroke:none"></ellipse>
<path display="{{ happy }}" d="M46 69.5 Q50 73.5 54 69.5" style="stroke:#3B2F2F;stroke-width:2"></path>
<g display="{{ worried }}"><path d="M46.5 72.5 Q50 69.5 53.5 72.5" style="stroke:#3B2F2F;stroke-width:2"></path><path d="M38.5 57.5 L45 55.5 M61.5 57.5 L55 55.5" style="stroke:#3B2F2F;stroke-width:1.8"></path><path data-anim="drip" d="M71 46 Q74 51 71 53 Q68 51 71 46 Z" style="fill:#9CD2FF;stroke:none"></path></g>
<g display="{{ tag }}"><rect x="40" y="75" width="20" height="11" rx="2.5" fill="#FFFFFF" style="stroke-width:1.8"></rect><path d="M44 79 L56 79 M44 82.5 L52 82.5" style="stroke:#3DBE8B;stroke-width:1.6"></path></g>
<g display="{{ glass }}"><path d="M86 70 L93 77" style="stroke-width:3.4"></path><circle cx="80" cy="63" r="9" fill="#DDF0FF"></circle><path d="M76 60 Q78 57.5 81 57.5" style="stroke:#FFFFFF;stroke-width:2"></path></g>
</g>
</svg>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:140,&quot;height&quot;:140},&quot;stage&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;seed&quot;,&quot;resume&quot;,&quot;portfolio&quot;,&quot;both&quot;,&quot;bud&quot;,&quot;bloom&quot;],&quot;default&quot;:&quot;both&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:120,&quot;tsType&quot;:&quot;number&quot;},&quot;mood&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;happy&quot;,&quot;worried&quot;],&quot;default&quot;:&quot;happy&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;hold&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;none&quot;,&quot;resume&quot;,&quot;tag&quot;,&quot;glass&quot;],&quot;default&quot;:&quot;none&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;wave&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props, st = p.stage ?? 'both', on = b => (b ? 'inline' : 'none');
    const tru = v => v === true || v === 'true';
    const sky = '#9CD2FF', lav = '#C9B6FF', grn = '#86D9AE';
    const A = { resume: sky, both: sky, bud: grn, bloom: grn }[st];
    const B = { portfolio: lav, both: lav, bud: grn, bloom: grn }[st];
    const hold = p.hold ?? 'none', wave = tru(p.wave), worried = p.mood === 'worried';
    const tall = st === 'bud' || st === 'bloom';
    return {
      px: p.size ?? 80, seed: on(st === 'seed'), body: on(st !== 'seed'),
      stemS: on(!tall), stemT: on(tall), leafA: on(!!A), leafB: on(!!B), colA: A || sky, colB: B || lav,
      bud: on(st === 'bud'), bloom: on(st === 'bloom'), happy: on(!worried), worried: on(worried),
      armL: on(hold !== 'resume'), armR: on(!wave && hold !== 'glass'), waveArm: on(wave),
      paper: on(hold === 'resume'), glassArm: on(hold === 'glass'), glass: on(hold === 'glass'), tag: on(hold === 'tag'),
      bodyFill: st === 'bloom' ? '#CFF3E0' : '#E6F8EE'
    };
  }
}
</script>
</body>
</html>
